{% extends "base.html" %}{% block body %}<div class="row justify-content-center"><div class="col-md-5"><div class="card"><div class="card-body">
<h5>Ganti Password</h5><form method="post"><input type="hidden" name="_csrf" value="{{ csrf }}">
<div class="mb-3"><label>Password lama</label><input type="password" name="lama" class="form-control" required></div>
<div class="mb-3"><label>Password baru (min. 6 karakter)</label><input type="password" name="baru" class="form-control" required></div>
<div class="mb-3"><label>Ulangi password baru</label><input type="password" name="ulang" class="form-control" required></div>
<button class="btn btn-primary">Simpan</button></form></div></div></div></div>{% endblock %}
